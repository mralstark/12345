name: Tests and security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.txt pip-audit bandit
      - name: Run tests
        run: python -m pytest -q
      - name: Scan Python code
        run: bandit -q -r api database handlers services utils bot.py config.py -ll
      - name: Audit dependencies
        run: pip-audit -r requirements.lock
