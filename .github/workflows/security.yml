name: Tests and security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Run tests
        run: python -m pytest -q
      - name: Scan Python code
        run: bandit -q -r api database handlers services utils scripts bot.py config.py -ll
      - name: Audit dependencies
        run: pip-audit -r requirements-dev.lock
