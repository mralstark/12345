name: Tests and security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Run tests
        run: python -m pytest -q
      - name: Scan Python code
        run: bandit -q -r api database handlers services utils scripts bot.py config.py -ll
      - name: Audit dependencies
        run: pip-audit -r requirements-dev.lock
