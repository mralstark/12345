<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=PT+Sans:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: "PT Sans", sans-serif; font-size: 15px; line-height: 1.45; }
    a { color: #d9b57b; } a:hover { color: #c9a05f; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 375px; height: 600px; overflow: hidden; background: #141414; color: #ece6dc; font-family: 'PT Sans', sans-serif; padding: 12px; display: flex; flex-direction: column; gap: 12px;">

  <div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 17px;">Вариант Б · Лента карточек</span>
      <span style="padding: 1px 8px; border-radius: 999px; background: rgba(217,181,123,0.18); color: #d9b57b; font-size: 11px; font-weight: 700;">выбран</span>
    </div>
    <div style="font-size: 13px; color: #9c9082; margin-top: 2px;">Пост читается целиком, не сжимаясь до плитки. Стоит в обоих профилях.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{ posts }}" as="post" hint-placeholder-count="2">
      <div style="background: #1e1b17; border-radius: 12px; overflow: hidden;">
        <sc-if value="{{ post.photo }}" hint-placeholder-val="{{ true }}">
          <img src="{{ post.photo }}" alt="" style="width: 100%; height: 160px; object-fit: cover; display: block;">
        </sc-if>
        <div style="padding: 12px;">
          <div style="font-size: 12px; color: #9c9082;">{{ post.when }}</div>
          <div style="margin-top: 4px;">{{ post.text }}</div>
          <div style="display: flex; align-items: center; gap: 16px; margin-top: 12px; color: #9c9082; font-size: 13px;">
            <span style="display: inline-flex; align-items: center; gap: 4px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" style="width: 16px; height: 16px;"><path d="M7 11v9H4v-9z"></path><path d="M7 11l5-8 1.2.6a2 2 0 0 1 1 2.3L13 10h5.4a2 2 0 0 1 2 2.5l-1.5 6A2 2 0 0 1 17 20H7z"></path></svg>
              <span>{{ post.likes }}</span>
            </span>
            <span style="display: inline-flex; align-items: center; gap: 4px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width: 16px; height: 16px;"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
              <span>{{ post.views }}</span>
            </span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview": {"width": 375, "height": 600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      posts: [
        { photo: 'intro-bg-sjezd.jpg', when: 'вчера в 19:40', text: 'Съезд Братства в Петербурге: 140 делегатов из двенадцати отделений.', likes: '14', views: '312' },
        { photo: null, when: '20 авг в 12:05', text: 'Разбор речи Плевако по делу Засулич — в четверг в 19:00, ауд. 312. Приходите со своими тезисами.', likes: '6', views: '188' }
      ]
    };
  }
}
</script>
</body>
</html>
