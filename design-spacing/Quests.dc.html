<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=PT+Sans:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: "PT Sans", sans-serif; font-size: 15px; line-height: 1.45; }
    a { color: #d9b57b; } a:hover { color: #c9a05f; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 400px; height: 690px; background: #0a0a0a; color: #ece6dc; font-family: 'PT Sans', sans-serif; padding: 16px 0 0;">
  <div style="background: #141414; border-radius: 16px 16px 0 0; padding: 20px 20px 24px; border-top: 1px solid rgba(217,181,123,0.22);">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 17px;">Задания</div>
      <div style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: #1e1b17; display: flex; align-items: center; justify-content: center; color: #9c9082;">×</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #1e1b17; border-radius: 12px; padding: 12px;">
      <span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: rgba(217,181,123,0.18); display: flex; align-items: center; justify-content: center; color: #d9b57b; font-weight: 700;">А</span>
      <span style="min-width: 0;">
        <span style="display: block; font-weight: 500;">Активов Актив</span>
        <span style="display: block; font-size: 12px; color: #9c9082;">Активист</span>
      </span>
    </div>

    <!-- Одно число вместо двух. «Уже забрал» и «Ждёт в Лобби» — это про то,
         нажал ли человек «Получить» у себя в Лобби. Руководителю это знать
         незачем: он спрашивает «сколько у него баллов», а не «сколько из них
         он успел забрать». Заодно исчезает и объяснение внизу, которое
         приходилось писать, чтобы неподвижная цифра не выглядела поломкой. -->
    <div style="background: #1e1b17; border-radius: 12px; padding: 12px; margin-top: 12px;">
      <div style="font-size: 12px; color: #9c9082;">Заработал за всё время</div>
      <div style="font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums;">{{ total }} <span style="color: #d9b57b;">★</span></div>
    </div>

    <!-- Заголовок раздела: 16 сверху, 8 снизу. Было 12 и −4 — то есть он почти
         касался карточки под собой и стоял ближе к чужому блоку, чем к своему. -->
    <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #9c9082; margin: 16px 0 8px;">Лидерство</div>

    <div style="background: #1e1b17; border-radius: 12px; padding: 0 12px;">
      <sc-for list="{{ quests }}" as="q" hint-placeholder-count="2">
        <div style="{{ q.rowStyle }}">
          <!-- Название во всю ширину, а не рядом с кнопкой: раньше полоска
               прогресса упиралась в «Отметить» и казалось, что она в него
               врезается. -->
          <div style="font-weight: 500;">{{ q.title }}</div>
          <div style="height: 5px; border-radius: 999px; background: rgba(217,181,123,0.16); margin: 10px 0 8px; overflow: hidden;">
            <div style="{{ q.barStyle }}"></div>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <span style="font-size: 12px; color: #9c9082; min-width: 0;">{{ q.progress }}</span>
            <button type="button" onClick="{{ q.mark }}" style="flex: none; min-height: 32px; padding: 6px 14px; border: none; border-radius: 9px; background: #d9b57b; color: #201a12; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Отметить</button>
          </div>

          <sc-if value="{{ q.marked }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(217,181,123,0.22);">
              <span style="font-size: 12px; color: {{ q.noteColor }};">{{ q.note }}</span>
              <button type="button" onClick="{{ q.undo }}" style="flex: none; padding: 4px 10px; border: 1px solid rgba(217,181,123,0.22); border-radius: 999px; background: none; color: #9c9082; font-family: inherit; font-size: 12px; cursor: pointer;">Отменить</button>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 16px;">
      <button type="button" style="flex: 1 1 auto; min-height: 44px; padding: 12px 16px; border: 1px solid rgba(217,181,123,0.22); border-radius: 10px; background: none; color: #ece6dc; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">Закрыть</button>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview": {"width": 400, "height": 690}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      quests: [
        { id: 1, title: 'Посетить мероприятие', count: 3, thresholds: [1, 5, 10], marks: 0, opened: 0 },
        { id: 2, title: 'Привести нового участника', count: 0, thresholds: [1, 3], marks: 0, opened: 0 },
      ],
      claimed: 1,
    };
  }

  earned(q) {
    return q.thresholds.filter((t) => q.count >= t).reduce((sum, t) => sum + t, 0);
  }

  step(id, delta) {
    this.setState({
      quests: this.state.quests.map((q) => {
        if (q.id !== id) return q;
        const before = this.earned(q);
        const next = { ...q, count: Math.max(0, q.count + delta) };
        next.marks = q.marks + delta;
        next.opened = q.opened + (this.earned(next) - before);
        return next;
      }),
    });
  }

  renderVals() {
    const qs = this.state.quests;
    const declMark = (n) => {
      const tail = n % 100 >= 11 && n % 100 <= 14 ? 0 : n % 10;
      return 'Отмечено ' + n + (tail === 1 ? ' раз' : (tail >= 2 && tail <= 4 ? ' раза' : ' раз'));
    };

    return {
      total: qs.reduce((sum, q) => sum + this.earned(q), 0),
      quests: qs.map((q, i) => {
        const target = q.thresholds.find((t) => q.count < t) ?? null;
        const done = target === null;
        const pct = done ? 100 : Math.round((q.count / target) * 100);
        return {
          title: q.title,
          rowStyle: 'padding: 12px 0;' + (i === qs.length - 1 ? '' : ' border-bottom: 1px solid rgba(217,181,123,0.22);'),
          barStyle: 'height: 100%; width: ' + pct + '%; border-radius: 999px; background: ' + (done ? '#4e8b5d' : '#d9b57b') + ';',
          progress: done
            ? 'Выполнено полностью · отмечено ' + q.count
            : q.count + ' из ' + target + ' — на ступени откроется ' + target + ' ★',
          marked: q.marks > 0,
          note: declMark(q.marks) + (q.opened ? ' — открылось ' + q.opened + ' ★' : ''),
          noteColor: q.opened ? '#4e8b5d' : '#9c9082',
          mark: () => this.step(q.id, 1),
          undo: () => this.step(q.id, -q.marks),
        };
      }),
    };
  }
}
</script>
</body>
</html>
