<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=PT+Sans:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: "PT Sans", sans-serif; font-size: 15px; line-height: 1.45; }
    a { color: #d9b57b; } a:hover { color: #c9a05f; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; overflow-y: auto; background: #141414; color: #ece6dc; font-family: 'PT Sans', sans-serif; padding: 16px 12px 24px;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px;">
    <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 20px;">Вузовские ячейки</div>
    <div style="font-size: 12px; color: #9c9082;">Красноярск</div>
  </div>

  <sc-for list="{{ cells }}" as="c" hint-placeholder-count="3">
    <button type="button" style="width: 100%; text-align: left; background: #1e1b17; border: none; border-radius: 12px; padding: 12px; margin-bottom: 8px; font-family: inherit; color: #ece6dc; cursor: pointer;">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="font-weight: 700; min-width: 0;">{{ c.name }}</div>
        <svg viewBox="0 0 24 24" fill="none" stroke="#9c9082" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; flex: none;"><path d="M9 6l6 6-6 6"></path></svg>
      </div>

      <!-- Руководитель отдельной строкой. Раньше он был склеен через «·» со
           счётчиком состава и ближайшим мероприятием — одна длинная строка
           мелким серым, где взгляду не за что зацепиться. -->
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
        <span style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: {{ c.leaderChipBg }}; display: flex; align-items: center; justify-content: center; color: {{ c.leaderChipFg }}; font-size: 11px; font-weight: 700;">{{ c.leaderInitial }}</span>
        <span style="font-size: 13px; {{ c.leaderStyle }}">{{ c.leaderName }}</span>
      </div>

      <!-- Состав и ближайшее мероприятие — всё, что нужно от строки списка.
           Бюджет убран: ячейкам его не расписывают. -->
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #9c9082;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px; flex: none;"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20a6 6 0 0 1 12 0M16 5.2a3.2 3.2 0 0 1 0 5.6M18 20a6 6 0 0 0-3-5.2"></path></svg>
        <span>{{ c.membersLine }}</span>
      </div>

      <sc-if value="{{ c.nextEvent }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #9c9082;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="width: 14px; height: 14px; flex: none;"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          <span>{{ c.nextEvent }}</span>
        </div>
      </sc-if>

    </button>
  </sc-for>

  <!-- Ячейка — производная от вуза: resolve_member_cell заводит её сама,
       как только человеку в этом отделении вписали вуз. Кнопки «создать»
       тут нет не по недоделке, а потому что создавать нечего. -->
  <div style="display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 12px; color: #9c9082;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="width: 16px; height: 16px; flex: none; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.01"></path></svg>
    <div>Ячейка появляется сама, когда человеку из вашего отделения впишут его вуз. Отдельно заводить её не нужно.</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width": 375, "height": 812}
}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [
      { name: 'Сибирский федеральный университет', leader: 'Кузнецов Иван', members: 14, next: 'Посвящение — 12 сент' },
      { name: 'СибГУ имени Решетнёва', leader: 'Макогон Ярослав', members: 6, next: null },
      { name: 'Красноярский медицинский', leader: null, members: 3, next: 'Первое собрание — 20 сент' },
    ];

    const plural = (n) => {
      const tail = n % 100 >= 11 && n % 100 <= 14 ? 0 : n % 10;
      return n + (tail === 1 ? ' человек' : (tail >= 2 && tail <= 4 ? ' человека' : ' человек'));
    };

    return {
      cells: cells.map((c) => ({
        name: c.name,
        leaderName: c.leader ?? 'Руководитель не назначен',
        leaderStyle: c.leader ? 'color: #ece6dc;' : 'color: #9c9082;',
        leaderInitial: c.leader ? c.leader[0] : '—',
        leaderChipBg: c.leader ? 'rgba(217,181,123,0.18)' : 'rgba(156,144,130,0.16)',
        leaderChipFg: c.leader ? '#d9b57b' : '#9c9082',
        membersLine: plural(c.members) + ' в составе',
        nextEvent: c.next,
      })),
    };
  }
}
</script>
</body>
</html>
