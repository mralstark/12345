<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=PT+Sans:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: "PT Sans", sans-serif; font-size: 15px; line-height: 1.45; }
    a { color: #d9b57b; } a:hover { color: #c9a05f; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 375px; height: 640px; position: relative; overflow: hidden; background: #141414; color: #ece6dc; font-family: 'PT Sans', sans-serif; display: flex; align-items: flex-end;">
  <div style="width: 100%; background: #141414; border-radius: 16px 16px 0 0; padding: 16px 16px 24px; border-top: 1px solid rgba(217,181,123,0.22);">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 17px;">Новость</div>
      <div style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: #1e1b17; display: flex; align-items: center; justify-content: center; color: #9c9082;">×</div>
    </div>

    <!-- Подпись показана так же, как она будет выглядеть в ленте: аватар и имя
         рядом. Раньше это была карточка «Опубликуется как» с названием под
         ней — лишний ярлык там, где достаточно показать сам результат. -->
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
      <span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: rgba(217,181,123,0.18); display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d9b57b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width: 19px; height: 19px;"><path d="M12 3l7 3v6c0 4.4-3 7.8-7 9-4-1.2-7-4.6-7-9V6z"></path></svg>
      </span>
      <span style="min-width: 0;">
        <span style="display: block; font-weight: 700; font-size: 14px;">Братство Академистов</span>
        <span style="display: block; font-size: 12px; color: #9c9082;">{{ audience }}</span>
      </span>
    </div>

    <!-- Поле без рамки и подписи: в окне «Новость» и так понятно, что писать.
         Рамка вокруг текста тут только сужала место. -->
    <textarea placeholder="Что нового?" style="width: 100%; min-height: 96px; padding: 0; border: none; background: none; color: #ece6dc; font-size: 16px; font-family: inherit; line-height: 1.5; resize: none; outline: none;"></textarea>

    <div style="height: 1px; background: rgba(217,181,123,0.22); margin: 12px 0;"></div>

    <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}">
      <!-- Пусто — одна большая цель для пальца вместо системной кнопки. -->
      <button type="button" onClick="{{ add }}" style="width: 100%; min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; border: 1px dashed rgba(217,181,123,0.35); border-radius: 12px; background: none; color: #9c9082; font-family: inherit; cursor: pointer;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d9b57b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 26px; height: 26px;"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l4.5-4.5 3.5 3.5 3-3L21 17"></path><circle cx="8.5" cy="9.5" r="1.3"></circle></svg>
        <span style="font-size: 14px; color: #ece6dc;">Добавить фотографии</span>
        <span style="font-size: 12px;">Можно несколько сразу</span>
      </button>
    </sc-if>

    <sc-if value="{{ hasPhotos }}" hint-placeholder-val="{{ true }}">
      <div>
        <!-- Выбранное видно сразу: миниатюры вместо строчки «файлы выбраны: 3».
             Крестик на каждой — убрать лишнюю, не начиная выбор заново. -->
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{ photos }}" as="photo" hint-placeholder-count="3">
            <span style="position: relative; display: block; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: #1e1b17;">
              <img src="{{ photo.src }}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
              <button type="button" onClick="{{ photo.drop }}" style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 999px; background: rgba(20,20,20,0.78); color: #ece6dc; cursor: pointer;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width: 12px; height: 12px;"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </span>
          </sc-for>

          <sc-if value="{{ canAddMore }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ add }}" style="width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px dashed rgba(217,181,123,0.35); border-radius: 10px; background: none; color: #d9b57b; cursor: pointer;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="width: 22px; height: 22px;"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </sc-if>
        </div>
        <div style="margin-top: 8px; font-size: 12px; color: #9c9082;">{{ countLabel }}</div>
      </div>
    </sc-if>

    <div style="display: flex; gap: 8px; margin-top: 16px;">
      <!-- Публикация занимает всю ширину: это единственное, ради чего окно
           открывали. Кнопка гаснет на время отправки — иначе от нетерпения
           жмут снова, и пост выходит по нескольку раз. -->
      <button type="button" onClick="{{ publish }}" style="{{ publishStyle }}">{{ publishLabel }}</button>
      <button type="button" style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 12px 16px; border: 1px solid rgba(217,181,123,0.22); border-radius: 10px; background: none; color: #ece6dc; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">Отмена</button>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "byline": {"editor": "enum", "options": ["Братство Академистов", "Академисты | Москва", "От себя"], "default": "Братство Академистов", "section": "Форма"},
  "$preview": {"width": 375, "height": 640}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { photos: [], sending: false };
  }

  pool() {
    return ['intro-bg-sjezd.jpg', 'intro-bg-ball.jpg', 'intro-bg-hangout.jpg'];
  }

  renderVals() {
    const photos = this.state.photos;
    const byline = this.props.byline ?? 'Братство Академистов';
    const audience = byline === 'Братство Академистов'
      ? 'Уведомление придёт всем'
      : (byline === 'От себя' ? 'Появится в ленте, никого не потревожит' : 'Уведомление придёт отделению');

    const plural = (n) => {
      const tail = n % 100 >= 11 && n % 100 <= 14 ? 0 : n % 10;
      return n + (tail === 1 ? ' фотография' : (tail >= 2 && tail <= 4 ? ' фотографии' : ' фотографий'));
    };

    return {
      audience: audience,
      empty: photos.length === 0,
      hasPhotos: photos.length > 0,
      canAddMore: photos.length < 6,
      countLabel: plural(photos.length),
      photos: photos.map((src, index) => ({
        src: src,
        drop: () => this.setState({ photos: photos.filter((_, i) => i !== index) }),
      })),
      add: () => {
        const pool = this.pool();
        this.setState({ photos: photos.concat([pool[photos.length % pool.length]]) });
      },
      publish: () => {
        if (this.state.sending) return;
        this.setState({ sending: true });
        setTimeout(() => this.setState({ sending: false }), 1400);
      },
      publishLabel: this.state.sending ? 'Публикую…' : 'Опубликовать',
      publishStyle: 'flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center;'
        + ' min-height: 44px; padding: 12px 16px; border: none; border-radius: 10px;'
        + ' font-family: inherit; font-size: 14px; font-weight: 500;'
        + (this.state.sending
            ? ' background: rgba(217,181,123,0.45); color: rgba(32,26,18,0.7); cursor: default;'
            : ' background: #d9b57b; color: #201a12; cursor: pointer;'),
    };
  }
}
</script>
</body>
</html>
