<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=PT+Sans:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: "PT Sans", sans-serif; font-size: 15px; line-height: 1.45; }
    a { color: #d9b57b; } a:hover { color: #c9a05f; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 375px; height: 640px; position: relative; overflow: hidden; background: #141414; color: #ece6dc; font-family: 'PT Sans', sans-serif; display: flex; align-items: flex-end;">
  <div style="width: 100%; background: #141414; border-radius: 16px 16px 0 0; padding: 16px 16px 24px; border-top: 1px solid rgba(217,181,123,0.22);">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 17px;">Новость</div>
      <div style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: #1e1b17; display: flex; align-items: center; justify-content: center; color: #9c9082;">×</div>
    </div>

    <div style="background: #1e1b17; border-radius: 12px; padding: 12px; margin-bottom: 12px;">
      <div style="font-size: 12px; color: #9c9082;">Опубликуется как</div>
      <div style="margin-top: 4px;">Братство Академистов</div>
    </div>

    <div style="margin-bottom: 12px;">
      <textarea placeholder="Текст новости" style="width: 100%; min-height: 90px; padding: 8px 12px; border-radius: 9px; border: 1px solid rgba(217,181,123,0.22); background: #141414; color: #ece6dc; font-size: 16px; font-family: inherit; resize: vertical;"></textarea>
    </div>

    <div style="margin-bottom: 12px;">
      <div style="font-size: 12px; color: #9c9082; margin-bottom: 4px;">Фотографии</div>
      <!-- Вот это и есть то самое: системный выбор файлов, который выглядит
           чужим в любом оформлении и ничего не показывает о выбранном. -->
      <div style="width: 100%; padding: 8px 12px; border-radius: 9px; border: 1px solid rgba(217,181,123,0.22); background: #141414; display: flex; align-items: center; gap: 10px;">
        <span style="padding: 4px 10px; border-radius: 4px; background: #efefef; color: #111; border: 1px solid #9a9a9a; font-size: 13px; font-family: -apple-system, system-ui, sans-serif;">Выбор файлов</span>
        <span style="color: #ece6dc; font-size: 13px; font-family: -apple-system, system-ui, sans-serif;">файлы не выбраны</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="display: inline-flex; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 10px; background: #d9b57b; color: #201a12; font-size: 14px; font-weight: 500;">Опубликовать</div>
      <div style="display: inline-flex; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(217,181,123,0.22); color: #ece6dc; font-size: 14px; font-weight: 500;">Отмена</div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview": {"width": 375, "height": 640}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
