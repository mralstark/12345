# __DOMAIN__ подставляет setup_server.sh. TLS-блок дописывает certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Модуль «Документы» принимает файлы до 25 МБ (MAX_UPLOAD_MB) — запас на границы.
    client_max_body_size 30m;

    # Mini App внутри Telegram — отдельный WebView; фрейминг разрешён только Telegram.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Экспорт PDF/XLSX по большому региону считается не мгновенно.
        proxy_read_timeout 120s;
    }
}
