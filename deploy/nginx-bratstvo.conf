# __DOMAIN__ подставляет setup_server.sh. TLS-блок дописывает certbot --nginx.
# В access log намеренно нет query string: подписанные media-токены находятся
# в параметре t и не должны попадать в журналы.
log_format bratstvo '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=bratstvo_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=bratstvo_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    access_log /var/log/nginx/bratstvo.access.log bratstvo;

    # Модуль «Документы» принимает файлы до 25 МБ (MAX_UPLOAD_MB) — запас на границы.
    client_max_body_size 30m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    # Mini App внутри Telegram — отдельный WebView; фрейминг разрешён только Telegram.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=bratstvo_per_ip burst=40 nodelay;
        limit_conn bratstvo_connections 20;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Экспорт PDF/XLSX по большому региону считается не мгновенно.
        proxy_read_timeout 120s;
    }
}
